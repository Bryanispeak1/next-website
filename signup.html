<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT - Sign Up</title>
    <link rel="stylesheet" href="/pages.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">♦ NEXT</div>
            <h2>Create Account</h2>
            <p>Join the next generation of tech</p>
        </div>

        <div class="social-container">
            <button class="social-btn">
                <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.64 0 3.12.56 4.28 1.67l3.2-3.2C17.52 1.58 14.96 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.85 2.99c.9-2.7 3.4-4.45 6.65-4.45z"/><path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.43h6.44c-.28 1.47-1.11 2.71-2.36 3.55l3.66 2.84c2.14-1.97 3.39-4.88 3.39-8.48z"/><path fill="#FBBC05" d="M5.35 14.51c-.23-.69-.36-1.42-.36-2.18s.13-1.49.36-2.18L1.5 7.16C.54 9.07 0 11.21 0 12.5s.54 3.43 1.5 5.34l3.85-3.33z"/><path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.66-2.84c-1.1.74-2.51 1.18-4.3 1.18-3.25 0-5.75-1.75-6.65-4.45L1.5 16.96C3.4 20.81 7.35 23 12 23z"/></svg>
                Sign up with Google
            </button>
            <button class="social-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.137 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
                Sign up with GitHub
            </button>
        </div>

        <div class="divider">or use email</div>

        <form id="signupForm" novalidate>
            <div class="form-group" id="nameGroup">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe">
                <div class="error-msg">Please enter your name</div>
            </div>

            <div class="form-group" id="emailGroup">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
                <div class="error-msg">Please enter a valid email address</div>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <div class="error-msg">Password must be at least 8 characters long</div>
            </div>

            <div class="form-options">
                <div class="terms">
                    <input type="checkbox" id="agree">
                    <label for="agree">I agree to the <a href="#">Terms & Conditions</a></label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <p class="footer-text">Already have an account? <a href="login.html">Log In</a></p>
    </div>

    <script src="pages.js"></script>
</body>
</html>
